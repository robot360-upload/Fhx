name: Decompile ELF
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify input executable
        run: |
          if [ ! -f executable ]; then
            echo "::error::The executable file was not found in the repository root."
            exit 1
          fi
          file executable
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download latest official Ghidra
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest"
          echo "Fetching latest Ghidra release information..."
          curl --fail --silent --show-error --location \
            "$API" -o release.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          import sys
          from urllib.parse import urlparse
          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)
          if release.get("draft") or release.get("prerelease"):
              sys.exit("The returned release is not a stable release.")
          assets = release.get("assets", [])
          # Select the official Ghidra distribution ZIP.
          matches = [
              asset for asset in assets
              if asset["name"].lower().endswith(".zip")
              and asset["name"].lower().startswith("ghidra")
              and "source" not in asset["name"].lower()
          ]
          if len(matches) != 1:
              print("Available release assets:", file=sys.stderr)
              for asset in assets:
                  print(" - " + asset["name"], file=sys.stderr)
              sys.exit(
                  f"Expected one Ghidra distribution ZIP; "
                  f"found {len(matches)}."
              )
          url = matches[0]["browser_download_url"]
          if urlparse(url).hostname != "github.com":
              sys.exit("Unexpected download host.")
          print(url)
          PY
          )"
          echo "Downloading $DOWNLOAD_URL"
          curl --fail --silent --show-error --location \
            "$DOWNLOAD_URL" -o ghidra.zip
          echo "Downloaded archive:"
          ls -lh ghidra.zip
          echo "Archive SHA-256:"
          sha256sum ghidra.zip
          mkdir -p ghidra-dist
          unzip -q ghidra.zip -d ghidra-dist
          GHIDRA_DIR="$(find ghidra-dist \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'ghidra*' -print -quit)"
          if [ -z "$GHIDRA_DIR" ] || \
             [ ! -f "$GHIDRA_DIR/support/analyzeHeadless" ]; then
            echo "::error::Invalid Ghidra distribution."
            exit 1
          fi
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          echo "Ghidra downloaded and extracted successfully."
      - name: Prepare analysis directories
        run: |
          mkdir -p analysis-output project
      - name: Run Ghidra headless analysis
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/project" \
            ExecutableAnalysis \
            -import "$GITHUB_WORKSPACE/executable" \
            -overwrite \
            -analysisTimeoutPerFile 1800 \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportDecompiled.java \
              "$GITHUB_WORKSPACE/analysis-output"
      - name: Package pseudocode
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d analysis-output ]; then
            echo "::error::No analysis output directory was created."
            exit 1
          fi
          zip -r decompiled-pseudocode.zip analysis-output
          ls -lh decompiled-pseudocode.zip
      - name: Upload pseudocode ZIP
        if: always() && hashFiles('decompiled-pseudocode.zip') != ''
        uses: actions/upload-artifact@v4
